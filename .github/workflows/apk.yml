# Fabrique l'APK Android à chaque envoi sur main : tests d'abord, puis export, puis publication
# sur la release « apk-test » (lien de téléchargement fixe).
name: APK Android

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]   # une modification de la doc seule ne refabrique pas l'APK
  workflow_dispatch:

permissions:
  contents: write

# Une fabrication en cours n'est jamais annulée (sinon le lien de l'APK peut rester cassé pendant
# l'envoi) ; seule la plus récente des fabrications en attente est gardée.
concurrency:
  group: apk
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  APK: build/android/damnes-des-sept-mers.apk

defaults:
  run:
    shell: bash   # active pipefail : une commande qui échoue avant un « | » fait échouer l'étape

jobs:
  apk:
    runs-on: ubuntu-24.04   # figé : ubuntu-latest change de version en octobre 2026
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache de Godot et des modèles d'export Android
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-android-v1

      - name: Installer Godot et les modèles d'export Android
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot && cd ~/godot
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && rm *.zip
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $TPL
          # on ne garde que les fichiers Android (le paquet complet pèse plus d'1 Go)
          unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz "templates/android_*" "templates/version.txt" -d $TPL
          rm *.tpz
          ls -la $TPL

      - name: Réglages Android de Godot (chemins du SDK et de Java)
        run: |
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
            cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          done
          cat ~/.config/godot/editor_settings-4.7.tres
          ls $ANDROID_HOME/build-tools | tail -3

      - name: Importer le projet
        run: ~/godot/godot --headless --path . --import

      - name: Tests automatiques
        run: |
          ~/godot/godot --headless --path . -s addons/gut/gut_cmdln.gd 2>&1 | tee gut.log
          # GUT ignore un fichier de test qui ne se charge pas sans échouer : on le refuse ici.
          # (Les scripts du jeu sont tous chargés par tests/unit/test_scripts.gd.)
          if grep -qE "Parse Error|Failed to load script|Ignoring script|SCRIPT ERROR" gut.log; then
            echo "::error::Un script ou un fichier de test n'a pas pu être chargé"
            grep -E "Parse Error|Failed to load script|Ignoring script|SCRIPT ERROR" gut.log | head -5 > erreurs.txt || true
            while read -r l; do echo "::error::$l"; done < erreurs.txt
            exit 1
          fi

      - name: Essai de la coop (un hôte et un invité sur la même machine)
        run: |
          # deux copies du jeu se connectent, jouent ensemble et vérifient qu'elles voient la même chose,
          # sur un Wi-Fi parfait puis sur un Wi-Fi moyen simulé (retard, irrégularité, pertes)
          ECHEC=0
          GODOT=~/godot/godot tools/test_coop.sh > coop.txt 2>&1 || ECHEC=1
          LATENCE_MS=30 GIGUE_MS=20 PERTE_PCT=3 GODOT=~/godot/godot tools/test_coop.sh > coop_wifi_moyen.txt 2>&1 || ECHEC=1
          # l'expédition à deux : salle nettoyée, porte prise à deux, salle suivante, écran de fin
          DESTINATION=expedition LATENCE_MS=30 GIGUE_MS=20 PERTE_PCT=3 GODOT=~/godot/godot tools/test_coop.sh > coop_expedition.txt 2>&1 || ECHEC=1
          cat coop.txt coop_wifi_moyen.txt coop_expedition.txt
          if [ "$ECHEC" = 1 ]; then
            grep -hE "ECHEC" coop.txt coop_wifi_moyen.txt coop_expedition.txt > erreurs_coop.txt || true
            while read -r l; do echo "::error::$l"; done < erreurs_coop.txt
            echo "::error::Essai de la coop en échec"
            exit 1
          fi

      - name: Numéro de version (augmente à chaque fabrication)
        run: |
          BASE=$(sed -nE 's/^config\/version="([0-9]+\.[0-9]+)\.[0-9]+"/\1/p' project.godot)
          VERSION="$BASE.${{ github.run_number }}"
          sed -i -E "s/^config\/version=.*/config\/version=\"$VERSION\"/" project.godot
          sed -i -E "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"$VERSION\"/" export_presets.cfg
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version : $VERSION"

      - name: Exporter l'APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/android/cle_de_test.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/android/cle_de_test.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          ~/godot/godot --headless --path . --export-release "Android" "$APK"
          test -s "$APK"
          ls -la "$APK"

      - name: Vérifier l'APK (nom du paquet, version, signature)
        # Les résultats sont écrits en annotations (::notice:: / ::error::), lisibles via l'API GitHub.
        # Les sorties passent par des fichiers : un « | head » ferait échouer l'étape à cause de pipefail.
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "::notice::build-tools : $(basename "$BT")"
          "$BT/aapt" dump badging "$APK" > badging.txt 2> aapt_err.txt \
            || echo "::warning::aapt a signalé : $(tr '\n' ' ' < aapt_err.txt | cut -c1-300)"
          echo "::notice::$(grep -m1 '^package:' badging.txt || echo 'aapt : aucune ligne package')"
          ERR=""
          grep -q "name='fr.teodico.damnes'" badging.txt || ERR="$ERR nom de paquet ;"
          grep -q "versionName='$VERSION'" badging.txt || ERR="$ERR version (attendue $VERSION) ;"
          "$BT/apksigner" verify --print-certs "$APK" > certs.txt 2> signer_err.txt \
            || ERR="$ERR signature refusée ($(tr '\n' ' ' < signer_err.txt | cut -c1-200)) ;"
          echo "::notice::$(grep -m1 'certificate DN' certs.txt || echo 'aucun certificat lu')"
          grep -q "Les Damnes des Sept Mers (test)" certs.txt || ERR="$ERR clé de test absente ;"
          if [ -n "$ERR" ]; then echo "::error::Vérification de l'APK :$ERR"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: damnes-des-sept-mers-${{ env.VERSION }}
          path: ${{ env.APK }}

      - name: Publier sur la release « apk-test »
        # seulement depuis main : une autre branche ne doit pas remplacer l'APK de Téo
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=apk-test
          if ! gh release view $TAG >/dev/null 2>&1; then
            gh release create $TAG --prerelease --target main --title "APK de test" --notes "Dernier APK de test."
          fi
          gh release upload $TAG "$APK" --clobber
          gh release edit $TAG --notes "Version $VERSION · commit ${GITHUB_SHA::7} · $(date -u '+%d/%m/%Y %H:%M') UTC"
